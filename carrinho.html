<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página Viva — Seu carrinho</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="home.css?v=7" rel="stylesheet">
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <header class="navbar navbar-expand-lg navbar-viva">
      <div class="container py-2">
        <a class="brand navbar-brand me-4" href="home.html">
          <span class="bars"><span></span><span></span></span>
          Página Viva
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu" aria-controls="navmenu" aria-expanded="false" aria-label="Abrir menu de navegação">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navmenu">
          <nav aria-label="Principal">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-4 gap-2">
            <li class="nav-item"><a class="nav-link nav-item-link" href="catalogo.html">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link nav-item-link muted" href="sobre.html">Sobre</a></li>
            <li class="nav-item">
              <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="search" id="busca" aria-label="Buscar livros" placeholder="Buscar livros...">
              </div>
            </li>
            <li class="nav-item">
              <a class="cart-link" href="carrinho.html" aria-label="Carrinho">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 4.6A1 1 0 0 0 5.6 19H17M17 19a2 2 0 1 0 4 0 2 2 0 0 0-4 0zM7 19a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"/></svg>
                <span class="badge-cart">2</span>
              </a>
            </li>
          </ul>
          </nav>
        </div>
      </div>
    </header>

    <main id="conteudo">
    <section class="cart-page">
      <div class="container">
        <h1 class="cart-title">Seu carrinho</h1>

        <div class="row g-4">
          <div class="col-lg-8">
            <div id="cartItems"></div>

            <div class="panel-card delivery-form">
              <h3>Dados para entrega</h3>
              <label for="nome">Nome completo</label>
              <input type="text" id="nome" class="form-control" placeholder="Seu nome">

              <label for="email">E-mail</label>
              <input type="email" id="email" class="form-control" placeholder="voce@email.com">

              <fieldset class="receb-group">
              <legend>Forma de recebimento</legend>
              <div class="radio-option">
                <input type="radio" name="recebimento" id="retirar" checked>
                <label for="retirar" class="mb-0 fw-normal">Retirar na loja</label>
              </div>
              <div class="radio-option">
                <input type="radio" name="recebimento" id="entrega">
                <label for="entrega" class="mb-0 fw-normal">Entrega em casa</label>
              </div>
              </fieldset>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="panel-card">
              <h3>Resumo do pedido</h3>
              <div class="summary-row"><span>Subtotal</span><span id="summarySubtotal">R$ 0,00</span></div>
              <div class="summary-row"><span>Retirada na loja</span><span>Grátis</span></div>
              <div class="summary-row total"><span>Total</span><span id="summaryTotal">R$ 0,00</span></div>

              <a href="confirmacao.html" id="checkoutBtn" class="btn btn-viva-primary">Finalizar compra</a>
              <a href="catalogo.html" class="btn btn-viva-outline">Continuar comprando</a>
            </div>
          </div>
        </div>
      </div>
    </section>
    </main>

    <footer class="site-footer">
      <div class="container py-4 d-flex flex-wrap justify-content-between gap-2">
        <span>&copy; 2026 Página Viva — Livraria Online</span>
        <nav aria-label="Rodapé">
          <a href="home.html">Início</a>
          <a href="catalogo.html">Catálogo</a>
          <a href="sobre.html">Sobre</a>
          <a href="carrinho.html">Carrinho</a>
        </nav>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="books.js"></script>
    <script src="cart.js"></script>
    <script>
      function renderCart() {
        const cart = getCart();
        const container = document.getElementById('cartItems');
        container.innerHTML = '';

        if (cart.length === 0) {
          container.innerHTML =
            '<div class="cart-empty">' +
            '<p>Seu carrinho está vazio.</p>' +
            '<a href="catalogo.html" class="btn btn-viva-primary">Ver catálogo</a>' +
            '</div>';
        } else {
          cart.forEach((item) => {
            const book = BOOKS[item.id];
            if (!book) return;
            const row = document.createElement('article');
            row.className = 'cart-item';
            row.innerHTML =
              '<div class="thumb ' + book.cover + '"><img src="' + book.image + '" alt="Capa do livro ' + book.title + '"></div>' +
              '<div class="info">' +
              '<div class="title">' + book.title + '</div>' +
              '<div class="author">' + book.author + '</div>' +
              '<div class="qty">Quantidade: ' + item.qty + '</div>' +
              '<button type="button" class="remove-link" data-id="' + item.id + '">Remover</button>' +
              '</div>' +
              '<div class="item-price">' + formatPrice(book.price * item.qty) + '</div>';
            container.appendChild(row);
          });
        }

        document.getElementById('summarySubtotal').textContent = formatPrice(cartTotal());
        document.getElementById('summaryTotal').textContent = formatPrice(cartTotal());

        container.querySelectorAll('.remove-link').forEach((btn) => {
          btn.addEventListener('click', () => {
            removeFromCart(btn.getAttribute('data-id'));
            renderCart();
          });
        });
      }

      renderCart();

      document.getElementById('checkoutBtn').addEventListener('click', (e) => {
        if (getCart().length === 0) {
          e.preventDefault();
        }
      });
    </script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
  </body>
</html>
